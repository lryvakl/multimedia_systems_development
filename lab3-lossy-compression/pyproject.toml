[project]
name = "lossy-compression"
version = "1.0.0"
description = "Experimental lossy image compression: block DCT vs Haar DWT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "matplotlib>=3.8",
]

[project.scripts]
lossy-compression = "lossy_compression.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lossy_compression"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "NPY"]
# Math symbols (×, α, –) in labels and docstrings are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]
